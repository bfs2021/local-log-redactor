<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>本地日志脱敏台</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#172b3a;background:#f3f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px 22px 36px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}h1{font-size:clamp(1.45rem,3vw,2rem);margin:0 0 8px;letter-spacing:-.03em}.sub{color:#526675;margin:0;line-height:1.65}.badge{white-space:nowrap;background:#e0f5ec;color:#08734d;border:1px solid #98d9bc;border-radius:999px;padding:9px 13px;font-size:.9rem;font-weight:700}.badge span{display:inline-block;width:8px;height:8px;background:#19a974;border-radius:50%;margin-right:7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.card{background:white;border:1px solid #dce6e9;border-radius:16px;padding:20px;box-shadow:0 8px 24px #15394b0a;min-width:0}.card h2{font-size:1.05rem;margin:0 0 14px}.actions,.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #bfd0d6;background:#fff;color:#1d3946;padding:9px 12px;min-height:40px}button:hover{background:#f2f8f7;border-color:#75aa9e}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #64b5a5;outline-offset:2px}textarea{display:block;width:100%;min-height:310px;resize:vertical;border:1px solid #cbd9dd;border-radius:11px;padding:13px;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#19303c;background:#fbfdfd}textarea::placeholder{color:#778b94}.muted{font-size:.86rem;color:#5e7179}.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.rule{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e1eaec;border-radius:9px;font-size:.9rem}.rule input{accent-color:#087e73;width:16px;height:16px}.custom{border-top:1px solid #e8eef0;padding-top:14px;margin-top:14px}.custom-row{display:flex;gap:8px}.custom-row input{min-width:0;flex:1;border:1px solid #cbd9dd;border-radius:9px;padding:9px 11px;font:inherit}.terms{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.term{display:flex;align-items:center;gap:5px;background:#edf5f4;border-radius:999px;padding:4px 5px 4px 10px;font-size:.85rem}.term button{min-height:26px;width:26px;padding:0;border:0;border-radius:50%;font-size:1.1rem;color:#526675}.result{min-height:310px;max-height:480px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7fafb;border:1px solid #dfe9eb;border-radius:11px;padding:13px;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#19303c}.result.empty{color:#8999a0}.stats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.stat{background:#edf4f6;color:#36515e;border-radius:999px;padding:6px 9px;font-size:.82rem}.stat strong{color:#087e73;margin-left:4px}.foot{margin-top:18px;padding:14px 16px;border-left:3px solid #d99c3c;background:#fff8e9;color:#654d22;border-radius:5px 10px 10px 5px;font-size:.88rem;line-height:1.6}.status{min-height:1.4em;color:#08734d;font-size:.86rem}footer{text-align:center;color:#61747e;font-size:.82rem;margin-top:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.wrap{padding:20px 14px}header{display:block}.badge{display:inline-block;margin-top:14px}.layout{grid-template-columns:1fr}.card{padding:16px}textarea,.result{min-height:230px}.rules{grid-template-columns:1fr 1fr}}@media(max-width:390px){.rules{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><div><h1>本地日志脱敏台</h1><p class="sub">粘贴日志，选择规则，快速生成可分享的脱敏副本。</p></div><div class="badge"><span></span>仅本地处理 · 不上传</div></header>
<main class="layout"><section class="card" aria-labelledby="input-title"><h2 id="input-title">输入与规则</h2><label class="muted" for="source">待处理文本</label><textarea id="source" spellcheck="false" placeholder="在此粘贴日志文本。内容仅在当前页面内存中处理。"></textarea><div class="actions"><div class="buttons"><button id="sample" type="button">载入虚构示例</button><button id="clear" type="button">清空文本</button></div><span class="muted">纯文本模式</span></div><div class="rules" aria-label="内置脱敏规则"><label class="rule"><input type="checkbox" data-rule="phone" checked>大陆手机号</label><label class="rule"><input type="checkbox" data-rule="email" checked>邮箱地址</label><label class="rule"><input type="checkbox" data-rule="ipv4" checked>IPv4 地址</label><label class="rule"><input type="checkbox" data-rule="token" checked>Bearer / API 长令牌</label><label class="rule"><input type="checkbox" data-rule="pem" checked>PEM 私钥块</label></div><div class="custom"><strong>自定义敏感词</strong><p class="muted">逐项添加，匹配时替换为 [REDACTED]。</p><div class="custom-row"><label class="sr-only" for="term-input">输入自定义敏感词</label><input id="term-input" type="text" maxlength="80" placeholder="例如：内部项目代号"><button id="add-term" type="button">添加</button></div><div id="terms" class="terms" aria-live="polite"></div></div></section>
<section class="card" aria-labelledby="result-title"><div class="result-head"><h2 id="result-title">脱敏结果</h2><span id="length" class="muted">0 字符</span></div><pre id="output" class="result empty" aria-live="polite">处理结果会显示在这里。</pre><div id="stats" class="stats" aria-label="规则命中数量"></div><div class="buttons"><button id="copy" type="button">复制结果</button><button id="download" type="button">下载 .txt</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section></main><div class="foot"><strong>请注意：</strong>正则规则可能漏检或误判。分享前请人工复核结果，避免遗漏账号、路径、内部域名等敏感信息。</div><footer>本页不使用外部资源、网络请求、Cookie 或持久化存储。关闭页面后，内存中的文本即被释放。</footer></div>
<script>(()=>{'use strict';const source=document.querySelector('#source'),output=document.querySelector('#output'),stats=document.querySelector('#stats'),length=document.querySelector('#length'),status=document.querySelector('#status'),termsBox=document.querySelector('#terms'),termInput=document.querySelector('#term-input');const names={phone:'手机号',email:'邮箱',ipv4:'IPv4',token:'令牌',pem:'私钥',custom:'自定义词'};let terms=[];const enabled=key=>document.querySelector('[data-rule="'+key+'"]').checked;const maskToken=value=>value.length<=8?'*'.repeat(value.length):value.slice(0,4)+'*'.repeat(Math.min(12,value.length-8))+value.slice(-4);
function run(){let text=source.value;const counts={phone:0,email:0,ipv4:0,token:0,pem:0,custom:0};if(enabled('pem'))text=text.replace(/-----BEGIN ([A-Z0-9 ]*PRIVATE KEY)-----[\s\S]*?-----END \1-----/g,()=>{counts.pem++;return '[REDACTED_PRIVATE_KEY]'});if(enabled('phone'))text=text.replace(/(?<!\d)1[3-9]\d{9}(?!\d)/g,()=>{counts.phone++;return '138****0000'});if(enabled('email'))text=text.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,value=>{counts.email++;return value[0]+'***@'+value.split('@').pop()});if(enabled('ipv4'))text=text.replace(/(?<![\d.])(?:\d{1,3}\.){3}\d{1,3}(?![\d.])/g,value=>{const p=value.split('.').map(Number);if(p.some(n=>n>255))return value;counts.ipv4++;return '192.0.2.*'});if(enabled('token')){text=text.replace(/(\bBearer\s+)([A-Za-z0-9._~+/-]{24,}={0,2})/gi,(all,prefix,value)=>{counts.token++;return prefix+maskToken(value)});text=text.replace(/((?:api[_-]?key|api[_-]?token|access[_-]?token|authorization)\s*[:=]\s*["']?)([A-Za-z0-9._~+/-]{24,}={0,2})/gi,(all,prefix,value)=>{counts.token++;return prefix+maskToken(value)})}for(const term of terms){if(!term)continue;const escaped=Array.from(term,c=>"\\^$.*+?()[]{}|".includes(c)?"\\"+c:c).join('');const re=new RegExp(escaped,'gi');text=text.replace(re,()=>{counts.custom++;return '[REDACTED]'})}output.textContent=text||'处理结果会显示在这里。';output.classList.toggle('empty',!text);length.textContent=text.length+' 字符';stats.textContent='';for(const key of Object.keys(counts)){const chip=document.createElement('span');chip.className='stat';chip.textContent=names[key];const number=document.createElement('strong');number.textContent=counts[key];chip.append(number);stats.append(chip)}status.textContent=text?'已在本地完成处理。':''}
function renderTerms(){termsBox.textContent='';terms.forEach((term,index)=>{const chip=document.createElement('span');chip.className='term';const label=document.createElement('span');label.textContent=term;const remove=document.createElement('button');remove.type='button';remove.setAttribute('aria-label','删除敏感词 '+term);remove.textContent='×';remove.addEventListener('click',()=>{terms.splice(index,1);renderTerms();run()});chip.append(label,remove);termsBox.append(chip)})}document.querySelectorAll('[data-rule]').forEach(el=>el.addEventListener('change',run));source.addEventListener('input',run);
document.querySelector('#sample').addEventListener('click',()=>{source.value='[2025-03-08 10:23:45] INFO login phone=13812345678 email=demo@example.invalid ip=203.0.113.42\nAuthorization: Bearer eyJhbGciOiJIUzI1NiJ9.fakeExampleTokenValue1234567890\napi_key=sk_test_FAKE_ONLY_0123456789ABCDEF\n-----BEGIN PRIVATE KEY-----\nTHIS IS A FICTIONAL SAMPLE, NOT A REAL KEY\n-----END PRIVATE KEY-----\nproject=ORCHID-DEMO';if(!terms.includes('ORCHID-DEMO'))terms.push('ORCHID-DEMO');renderTerms();run();status.textContent='已载入虚构示例；示例值不可用于登录或访问。'});document.querySelector('#clear').addEventListener('click',()=>{source.value='';run();source.focus()});document.querySelector('#add-term').addEventListener('click',()=>{const value=termInput.value.trim();if(value&&!terms.includes(value)){terms.push(value);termInput.value='';renderTerms();run()}else if(!value){status.textContent='先输入一个敏感词。'}});termInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();document.querySelector('#add-term').click()}});
document.querySelector('#copy').addEventListener('click',async()=>{if(!source.value){status.textContent='没有可复制的结果。';return}try{await navigator.clipboard.writeText(output.textContent)}catch{const helper=document.createElement('textarea');helper.value=output.textContent;helper.style.position='fixed';helper.style.opacity='0';document.body.append(helper);helper.select();const ok=document.execCommand('copy');helper.remove();if(!ok){status.textContent='复制失败，请手动选择结果。';return}}status.textContent='已复制脱敏结果。'});document.querySelector('#download').addEventListener('click',()=>{if(!source.value){status.textContent='没有可下载的结果。';return}const blob=new Blob([output.textContent],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='redacted-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已生成脱敏文本下载。'});run()})();</script></body></html>
